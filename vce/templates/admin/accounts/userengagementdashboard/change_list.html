{% extends "admin/change_list.html" %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    .engagement-dashboard {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 12px;
      margin: 0 0 16px;
    }
    .engagement-card {
      background: var(--body-bg);
      border: 1px solid var(--hairline-color);
      border-top: 3px solid #f47b20;
      border-radius: 6px;
      padding: 16px;
    }
    .engagement-card__label {
      color: var(--body-quiet-color);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .engagement-card__value {
      color: var(--body-fg);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-top: 6px;
    }
    .engagement-note {
      background: var(--darkened-bg);
      border-left: 3px solid #f47b20;
      color: var(--body-quiet-color);
      margin: 0 0 18px;
      padding: 10px 12px;
    }
    .engagement-metric {
      display: inline-block;
      margin: 0 8px 3px 0;
      white-space: nowrap;
    }
    .engagement-empty {
      color: var(--body-quiet-color);
      font-style: italic;
      white-space: nowrap;
    }
    #result_list th:first-child,
    #result_list td:first-child {
      left: 0;
      position: sticky;
      z-index: 1;
    }
    #result_list td:first-child {
      background: var(--body-bg);
    }
    @media (max-width: 900px) {
      .engagement-dashboard {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }
    @media (max-width: 520px) {
      .engagement-dashboard {
        grid-template-columns: 1fr;
      }
    }
  </style>
{% endblock %}

{% block content %}
  <div class="engagement-dashboard">
    {% for label, value in dashboard_cards %}
      <div class="engagement-card">
        <div class="engagement-card__label">{{ label }}</div>
        <div class="engagement-card__value">{{ value }}</div>
      </div>
    {% endfor %}
  </div>
  <div class="engagement-note">{{ tracking_note }}</div>
  {{ block.super }}
{% endblock %}
